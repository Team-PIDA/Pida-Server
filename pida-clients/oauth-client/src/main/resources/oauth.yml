spring:
  cloud:
    discovery:
      enabled: false
    openfeign:
      client:
        config:
          kakao-auth-api:
            connectTimeout: 1000
            readTimeout: 2000
            loggerLevel: full
          apple-auth-api:
            connectTimeout: 1000
            readTimeout: 2000
            loggerLevel: full
  compression:
    response:
      enabled: false
  httpclient:
    max-connections: 2000
    max-connections-per-route: 500

apple:
  bundle-id: ${APPLE_BUNDLE_ID}
