services:
  pida-db:
    image: postgis/postgis:13-3.1
    container_name: pida-local-pg
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pida
      POSTGRES_USER: pida
      POSTGRES_PASSWORD: pida!@
      TZ: Asia/Seoul
    command: [ "postgres", "-c", "log_statement=all" ]
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
